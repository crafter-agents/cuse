name: cuse GUI parity check on windows-11-arm (spike, issue #103)

on:
  workflow_dispatch:

jobs:
  windows-arm64-parity-check:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun build --compile src/cli.ts --outfile cuse
      - name: the documented workaround, proved on disk
        shell: bash
        run: ./scenarios/verify-workaround.sh ./cuse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-workaround
          path: |
            notepad-target.txt
            notepad-elements.json
            windows-before-drag.json
            windows-after-drag.json
            assert-pass.json
            assert-fail.json
