name: rig
# Verification cells: cuse pointed at real third-party tools, at the exact seam
# where they stop being able to see themselves.
#
# Everything in `ci.yml` drives a target this repo controls. That is the right
# way to test cuse, and it is the wrong way to find out whether cuse is useful:
# a target you wrote answers the way you expected. These jobs install published
# tools from npm and drive them where the operating system takes over.
#
# Not on every push. A macOS runner bills at ten times a Linux one and these
# install browsers and proxies, so they run nightly and on demand. A gate that
# gets deleted for slowing the build protects nothing.
# On demand it is a reproduction machine: pick the version, pick the cell, or
# point it at a pull request and it builds that instead. A report saying "0.32.3
# does this and 0.33.1 does not" cannot be answered by a workflow with the
# version baked in.
on:
  workflow_dispatch:
    inputs:
      cells:
        description: "which cells to run"
        type: choice
        default: all
        options: [all, seam, ios, portless]
      agent_browser_version:
        description: "agent-browser version from npm (ignored when a PR is given)"
        default: "0.33.1"
      agent_browser_pr:
        description: "build agent-browser from this vercel-labs PR instead of npm"
        default: ""
      portless_version:
        description: "portless version from npm"
        default: "0.15.4"
  schedule:
    - cron: "17 5 * * *"
  push:
    paths:
      - "rig/**"
      - ".github/workflows/rig.yml"

# A scheduled or push run has no inputs, and must behave as it always did.
env:
  CELLS: ${{ github.event.inputs.cells || 'all' }}
  AB_VERSION: ${{ github.event.inputs.agent_browser_version || '0.33.1' }}
  AB_PR: ${{ github.event.inputs.agent_browser_pr || '' }}
  PORTLESS_VERSION: ${{ github.event.inputs.portless_version || '0.15.4' }}

jobs:
  # agent-browser handles web content through CDP. A file input hands control to
  # the operating system, and the panel that appears is not in the DOM.
  agent-browser-seam:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.cells == 'all' || github.event.inputs.cells == 'seam'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      # Only needed when building a pull request; free when installing from npm.
      - uses: dtolnay/rust-toolchain@stable
        if: env.AB_PR != ''
      - run: bun build --compile --external koffi src/cli.ts --outfile cuse

      - name: install the agent-browser under test
        run: |
          chmod +x rig/install-agent-browser.sh
          ./rig/install-agent-browser.sh
      - name: what is under test
        run: agent-browser --version || true

      - name: install the browser it drives
        run: agent-browser install --with-deps || agent-browser install || true

      - name: the seam
        run: |
          chmod +x rig/agent-browser-seam.sh
          ./rig/agent-browser-seam.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-browser-seam
          path: |
            panel.json
            after.json
            ab-snapshot.txt
            open.log
            windows.json
            windows-after-click.json
            panel-summary.txt
            panel-candidates.txt
            panel-svc.json
            svc-summary.txt
            svc-candidates.txt
            after-summary.txt

  # The mobile cell. agent-browser has a whole iOS Simulator backend and no test
  # anywhere: its own CI runs every end-to-end check on ubuntu, and the macOS
  # runners only compile. An untested backend is a hypothesis.
  agent-browser-ios:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.cells == 'all' || github.event.inputs.cells == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - run: bun build --compile --external koffi src/cli.ts --outfile cuse

      - name: what Xcode and simulators are here
        run: |
          xcodebuild -version || true
          xcrun simctl list runtimes | head -10 || true

      - uses: dtolnay/rust-toolchain@stable
        if: env.AB_PR != ''
      - name: install the agent-browser under test, and the driver it needs
        run: |
          chmod +x rig/install-agent-browser.sh
          ./rig/install-agent-browser.sh
          # agent-browser launches Appium itself and reuses one already
          # listening on 4723, so this only has to exist on PATH.
          npm install -g appium
          appium driver install xcuitest || appium driver list --installed

      # Missing this is what produced four wrong diagnoses. The daemon's own log
      # says `[chrome-search] browsers_dir does not exist`: with -p ios it still
      # resolves a browser at startup, and there was none installed because this
      # step only existed in the other job. Whether that resolution *should*
      # happen for an iOS session is a question for whoever owns it - but it
      # cannot be asked until the browser is there.
      - name: install the browser the daemon looks for even with -p ios
        run: agent-browser install --with-deps || agent-browser install || true

      - name: drive a simulator
        run: |
          chmod +x rig/agent-browser-ios.sh
          ./rig/agent-browser-ios.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-browser-ios
          path: |
            devices.txt
            devices-2nd.txt
            requests.tsv
            booted.txt
            appium-status.json
            open-warm.log
            open-built.log
            post-build-status.txt
            default.engine
            default.provider
            '*.log'
            open.log
            server.log
            ios-before.png
            ios-after.png

  # portless puts a local CA in the system trust store, which macOS gates behind
  # an authentication surface no synthetic event can answer.
  portless-wall:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.cells == 'all' || github.event.inputs.cells == 'portless'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - run: bun build --compile --external koffi src/cli.ts --outfile cuse

      - name: install the portless under test
        run: |
          echo "portless@$PORTLESS_VERSION"
          bun add -g "portless@$PORTLESS_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: portless --version || true

      - name: the wall
        run: |
          chmod +x rig/portless-wall.sh
          ./rig/portless-wall.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portless-wall
          path: |
            proxy-tls.log
            proxy-plain.log
            windows-during-trust.json
            securityagent.json
