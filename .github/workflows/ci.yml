name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: test (pure core, runs everywhere)
        run: bun test
      - name: build standalone binary
        run: bun build --compile src/cli.ts --outfile cu-${{ matrix.os }}
      - name: os detection
        run: ./cu-${{ matrix.os }} os --json

  # capture is the action that actually depends on the machine having a screen.
  # Hard gate on all three platforms: no `|| true`, and the PNG is decoded to
  # prove it is a real frame rather than a 0-byte file.
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: build
        run: bun build --compile src/cli.ts --outfile cu

      # Linux runners are headless: no display, no imagemagick. cu reports both
      # as structured errors instead of failing opaquely - assert that it does.
      - name: linux - preflight refuses headless, with a reason
        if: runner.os == 'Linux'
        run: |
          out=$(./cu capture out.png --json || true)
          echo "$out"
          echo "$out" | grep -q '"ok":false' || { echo "expected a refusal on a headless runner"; exit 1; }
      - name: linux - provide the display cu asks for, then capture for real
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick x11-utils
          out=$(xvfb-run -a --server-args="-screen 0 1280x1024x24" ./cu capture out.png --json)
          echo "$out"
          # A bare Xvfb has nothing drawn on it, so the frame is blank. cu must
          # say so rather than hand an agent an empty screen as a success.
          echo "$out" | grep -q '"warn"' || { echo "expected a blank-frame warning on a bare Xvfb"; exit 1; }

      - name: macos/windows - capture on the runner's own session
        if: runner.os != 'Linux'
        run: ./cu capture out.png --json

      # A PNG magic number is not proof of a frame; read the IHDR dimensions.
      - name: assert the capture is a real frame
        shell: bash
        run: |
          bun -e '
            const b = new Uint8Array(await Bun.file("out.png").arrayBuffer());
            if (![0x89, 0x50, 0x4e, 0x47].every((v, i) => b[i] === v))
              throw new Error("not a PNG: " + b.length + " bytes");
            const dv = new DataView(b.buffer);
            const [w, h] = [dv.getUint32(16), dv.getUint32(20)];
            if (w < 100 || h < 100) throw new Error(`implausible frame ${w}x${h}`);
            console.log(`ok: ${w}x${h}, ${b.length} bytes`);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: capture-${{ matrix.os }}
          path: out.png

  # Does input actually land in a window? Capture, act, capture again, and let
  # cu's own differ decide - the only check that cannot pass while the keystroke
  # goes nowhere. Runs against a throwaway app on the runner, never a real desktop.
  input:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: build
        run: bun build --compile src/cli.ts --outfile cu

      - name: linux - type into an xterm under Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick xdotool xterm xfonts-base
          cat > drive.sh <<'EOF'
          set -e
          # -T names the window: without it xterm titles itself after the
          # command it runs, so the window was called "sleep" and focus could
          # not find it. Same trick as the Windows target.
          # A shell, not `-e sleep`: the shell echoes what is typed, so the
          # pixels that change are the keystroke itself and nothing else.
          xterm -T CU_TARGET -geometry 100x30+0+0 2>xterm.log &
          sleep 4
          echo "--- windows on :99 ---"
          xdotool search --onlyvisible --name . getwindowname %@ 2>/dev/null || echo "(none)"
          # No window manager here, so X focuses nothing until we ask it to.
          ./cu focus CU_TARGET --json
          # Control: two frames with nothing typed between them must be SAME.
          # Without it, a blinking cursor would look exactly like a keystroke.
          ./cu capture control-a.png --json
          sleep 1
          ./cu capture control-b.png --json
          ./cu diff control-a.png control-b.png --same-under=0 --json | tee control.json
          ./cu capture before.png --json
          ./cu type "cu input reached this window" --json
          sleep 1
          ./cu capture after.png --json
          ./cu diff before.png after.png --same-under=0 --json | tee diff.json
          EOF
          chmod +x drive.sh
          timeout 180 xvfb-run -a --server-args="-screen 0 1280x1024x24" ./drive.sh

      - name: macos - type into TextEdit
        if: runner.os == 'macOS'
        run: |
          ./cu launch TextEdit --json
          sleep 5
          ./cu capture control-a.png --json
          sleep 1
          ./cu capture control-b.png --json
          ./cu diff control-a.png control-b.png --same-under=0 --json | tee control.json
          ./cu capture before.png --json
          ./cu type "cu input reached this window" --json
          sleep 2
          ./cu capture after.png --json
          ./cu diff before.png after.png --same-under=0 --json | tee diff.json

      # Windows input cannot be proven on a hosted runner: processes the job
      # starts present no window on the captured desktop (Get-Process returns an
      # empty MainWindowTitle table), so SendKeys has nothing to post to. Rather
      # than fake a pass, assert the behaviour that matters in that situation -
      # cu refuses and names the missing window instead of reporting success.
      - name: windows - a keystroke with no window refuses, and says why
        if: runner.os == 'Windows'
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scenarios/win-target.ps1
          out=$(./cu focus CU_TARGET --json || true)
          echo "$out"
          echo "$out" | grep -q "no window matching 'CU_TARGET'" || {
            echo "expected a named refusal, got: $out"; exit 1; }

      # The screen must differ between the two frames. If the keystroke went
      # nowhere, the verdict is SAME and this fails - which is the point.
      # An idle screen must be SAME and a typed-on screen must be CHANGED. The
      # control is what makes the second assertion mean something: without it, a
      # blinking cursor would pass as proof that input landed.
      - name: assert an idle screen does not change on its own
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cat control.json
          grep -q '"verdict":"SAME"' control.json || {
            echo "the screen changes without input, so the input check proves nothing"; exit 1; }

      - name: assert the screen changed because of the keystroke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cat diff.json
          grep -q '"verdict":"CHANGED"' diff.json || {
            echo "input did not change the screen: the keystroke was delivered to nothing"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-${{ matrix.os }}
          path: |
            before.png
            after.png
            diff.json
            control.json
