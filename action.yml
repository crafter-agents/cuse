name: Run cuse scenario
description: Install cuse (macOS arm64/x64, Linux arm64/x64, Windows x64; Windows arm64 unsupported, use executable-path) and run a checked-in scenario with structured outputs

inputs:
  scenario:
    description: Path to the checked-in scenario to execute
    required: true
  version:
    description: Released cuse version to install
    required: false
    default: v0.1.0
  executable-path:
    description: Explicit cuse executable for repository CI; skips release download when set
    required: false
    default: ""
  linux-display:
    description: Linux display preparation mode (automatic, always, or never)
    required: false
    default: automatic
  linux-accessibility:
    description: Whether to install Linux AT-SPI accessibility support (true or false)
    required: false
    default: "false"
  working-directory:
    description: Repository-relative directory from which to run the scenario
    required: false
    default: "."
  evidence-name:
    description: Portable name for the prepared evidence directory
    required: false
    default: cuse-evidence

outputs:
  install-plan-json:
    description: Install plan for the current runner
    value: ${{ steps.resolve-plan-unix.outputs.plan-json || steps.resolve-plan-windows.outputs.plan-json }}
  executable-path:
    description: Absolute path to the selected cuse executable
    value: ${{ steps.select-unix.outputs.path || steps.select-windows.outputs.path }}
  verdict:
    description: Structured scenario verdict
    value: ${{ steps.execute-unix.outputs.verdict || steps.execute-windows.outputs.verdict }}
  result-json:
    description: Complete structured scenario result
    value: ${{ steps.execute-unix.outputs.result-json || steps.execute-windows.outputs.result-json }}
  evidence-path:
    description: Absolute path to the prepared evidence directory
    value: ${{ steps.evidence-unix.outputs.evidence-path || steps.evidence-windows.outputs.evidence-path }}

runs:
  using: composite
  steps:
    - id: prepare-unix
      name: Prepare runner platform
      if: runner.os != 'Windows'
      shell: bash
      env:
        CUSE_SCENARIO: ${{ inputs.scenario }}
        CUSE_LINUX_DISPLAY: ${{ inputs.linux-display }}
        CUSE_LINUX_ACCESSIBILITY: ${{ inputs.linux-accessibility }}
      run: |
        "${GITHUB_ACTION_PATH}/scripts/action/prepare-platform.sh" \
          "${RUNNER_OS}" "${CUSE_SCENARIO}" "${CUSE_LINUX_DISPLAY}" \
          "${CUSE_LINUX_ACCESSIBILITY}" "${GITHUB_ENV}"

    - id: prepare-windows
      name: Prepare runner platform
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CUSE_LINUX_DISPLAY: ${{ inputs.linux-display }}
        CUSE_LINUX_ACCESSIBILITY: ${{ inputs.linux-accessibility }}
      run: |
        & "${env:GITHUB_ACTION_PATH}/scripts/action/prepare-windows.ps1" $env:CUSE_LINUX_DISPLAY $env:CUSE_LINUX_ACCESSIBILITY

    - id: resolve-plan-unix
      name: Resolve cuse install plan
      if: runner.os != 'Windows'
      shell: bash
      run: |
        plan_json="$("${GITHUB_ACTION_PATH}/scripts/action/resolve-install-plan.sh" "${RUNNER_OS}" "${RUNNER_ARCH}")"
        echo "plan-json=${plan_json}" >> "${GITHUB_OUTPUT}"
        {
          echo "### cuse install plan"
          echo
          echo '```json'
          echo "${plan_json}"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

    - id: resolve-plan-windows
      name: Resolve cuse install plan
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $planJson = & "${env:GITHUB_ACTION_PATH}/scripts/action/resolve-install-plan.ps1" -RunnerOS $env:RUNNER_OS -RunnerArch $env:RUNNER_ARCH
        "plan-json=$planJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        @("### cuse install plan", "", '```json', $planJson, '```') |
          Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

    - id: install-unix
      name: Download and verify cuse
      if: runner.os != 'Windows' && inputs.executable-path == ''
      shell: bash
      env:
        CUSE_VERSION: ${{ inputs.version }}
      run: |
        path="$("${GITHUB_ACTION_PATH}/scripts/action/install.sh" "${CUSE_VERSION}" "${RUNNER_OS}" "${RUNNER_ARCH}" "${RUNNER_TEMP}/cuse")"
        echo "path=${path}" >> "${GITHUB_OUTPUT}"

    - id: install-windows
      name: Download and verify cuse
      if: runner.os == 'Windows' && inputs.executable-path == ''
      shell: pwsh
      env:
        CUSE_VERSION: ${{ inputs.version }}
      run: |
        $path = & "${env:GITHUB_ACTION_PATH}/scripts/action/install.ps1" $env:CUSE_VERSION $env:RUNNER_OS $env:RUNNER_ARCH "${env:RUNNER_TEMP}/cuse"
        "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - id: select-unix
      name: Select cuse executable
      if: runner.os != 'Windows'
      shell: bash
      env:
        CUSE_EXECUTABLE_OVERRIDE: ${{ inputs.executable-path }}
        CUSE_INSTALLED_EXECUTABLE: ${{ steps.install-unix.outputs.path }}
      run: |
        path="$("${GITHUB_ACTION_PATH}/scripts/action/select-executable.sh" \
          "${CUSE_EXECUTABLE_OVERRIDE}" "${CUSE_INSTALLED_EXECUTABLE}" "${GITHUB_WORKSPACE}")"
        echo "path=${path}" >> "${GITHUB_OUTPUT}"

    - id: select-windows
      name: Select cuse executable
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CUSE_EXECUTABLE_OVERRIDE: ${{ inputs.executable-path }}
        CUSE_INSTALLED_EXECUTABLE: ${{ steps.install-windows.outputs.path }}
      run: |
        $path = & "${env:GITHUB_ACTION_PATH}/scripts/action/select-executable.ps1" `
          $env:CUSE_EXECUTABLE_OVERRIDE $env:CUSE_INSTALLED_EXECUTABLE $env:GITHUB_WORKSPACE
        "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - id: execute-unix
      name: Execute scenario
      if: runner.os != 'Windows'
      continue-on-error: true
      shell: bash
      env:
        CUSE_EXECUTABLE: ${{ steps.select-unix.outputs.path }}
        CUSE_SCENARIO: ${{ inputs.scenario }}
        CUSE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        "${GITHUB_ACTION_PATH}/scripts/action/execute.sh" \
          "${CUSE_EXECUTABLE}" "${CUSE_SCENARIO}" \
          "${CUSE_WORKING_DIRECTORY}" "${GITHUB_OUTPUT}"

    - id: execute-windows
      name: Execute scenario
      if: runner.os == 'Windows'
      continue-on-error: true
      shell: pwsh
      env:
        CUSE_EXECUTABLE: ${{ steps.select-windows.outputs.path }}
        CUSE_SCENARIO: ${{ inputs.scenario }}
        CUSE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        & "${env:GITHUB_ACTION_PATH}/scripts/action/execute.ps1" $env:CUSE_EXECUTABLE $env:CUSE_SCENARIO $env:CUSE_WORKING_DIRECTORY $env:GITHUB_OUTPUT

    - id: evidence-unix
      name: Prepare scenario evidence and summary
      if: always() && runner.os != 'Windows'
      shell: bash
      env:
        CUSE_EVIDENCE_NAME: ${{ inputs.evidence-name }}
        CUSE_RESULT_JSON: ${{ steps.execute-unix.outputs.result-json }}
        CUSE_EXIT_CODE: ${{ steps.execute-unix.outputs.exit-code }}
      run: |
        node "${GITHUB_ACTION_PATH}/scripts/action/prepare-evidence.mjs" \
          "${RUNNER_TEMP}" "${CUSE_EVIDENCE_NAME}" "${CUSE_RESULT_JSON}" \
          "${CUSE_EXIT_CODE}" "${GITHUB_OUTPUT}" "${GITHUB_STEP_SUMMARY}"

    - id: evidence-windows
      name: Prepare scenario evidence and summary
      if: always() && runner.os == 'Windows'
      shell: pwsh
      env:
        CUSE_EVIDENCE_NAME: ${{ inputs.evidence-name }}
        CUSE_RESULT_JSON: ${{ steps.execute-windows.outputs.result-json }}
        CUSE_EXIT_CODE: ${{ steps.execute-windows.outputs.exit-code }}
      run: |
        & node "${env:GITHUB_ACTION_PATH}/scripts/action/prepare-evidence.mjs" `
          ([string]$env:RUNNER_TEMP) ([string]$env:CUSE_EVIDENCE_NAME) `
          ([string]$env:CUSE_RESULT_JSON) ([string]$env:CUSE_EXIT_CODE) `
          ([string]$env:GITHUB_OUTPUT) ([string]$env:GITHUB_STEP_SUMMARY)

    - name: Preserve scenario exit code
      if: runner.os != 'Windows'
      shell: bash
      env:
        CUSE_EXIT_CODE: ${{ steps.execute-unix.outputs.exit-code }}
      run: |
        [[ "${CUSE_EXIT_CODE}" =~ ^[0-9]+$ ]] || {
          echo "cuse execution adapter did not report an exit code" >&2
          exit 4
        }
        exit "${CUSE_EXIT_CODE}"

    - name: Preserve scenario exit code
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CUSE_EXIT_CODE: ${{ steps.execute-windows.outputs.exit-code }}
      run: |
        if ($env:CUSE_EXIT_CODE -notmatch '^\d+$') {
          Write-Error "cuse execution adapter did not report an exit code"
          exit 4
        }
        exit [int]$env:CUSE_EXIT_CODE
